# The package, the tests (Python and the app's end-to-end test) and gitleaks.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  test:
    # Only ever from main (D45): dispatched on another ref, it runs nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: nix
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - name: The package (what the homelab deploys)
        run: nix build -L --no-link .#packages.x86_64-linux.default
      - name: The Python tests
        run: nix develop -c python -m pytest -q
      - name: The app's end-to-end test (headless Chromium, from nixpkgs)
        run: nix develop -c curator-e2e

  gitleaks:
    if: github.ref == 'refs/heads/main'
    runs-on: nix
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
      - run: nix run nixpkgs#gitleaks -- git --no-banner --redact --verbose .
