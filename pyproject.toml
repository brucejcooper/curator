[project]
name = "curator"
version = "0.1.0"
description = "AI-curated news feed for Mastorss"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.70",
  "httpx>=0.27",
  "keyring>=25",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.optional-dependencies]
# The server; the Mac agent needs only the base dependencies.
server = [
  "fast-langdetect>=1.0.1",
  "fastembed>=0.4",
  "feedparser>=6",
  "numpy>=1.26",
  "pyjwt[crypto]>=2.8",
  "scikit-learn>=1.5",
  "starlette>=0.40",
  "typesafe-sdk>=0.7",
  "uvicorn>=0.30",
]

[project.scripts]
curator-refresh-profile = "curator.profile_refresh:main"
curator-agent = "curator_agent.cli:main"
curator = "curator.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curator", "agent/curator_agent"]

[tool.uv]
python-preference = "only-managed"
